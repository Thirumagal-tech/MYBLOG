{%extends 'base.html'%}
{%block content %}
    <div class="container-fluid ">
       
        <div class="row">
            <div class="col-lg-8">
              <h1 class="mb-4">{{post.title}} <small>({{post.category.name}}</small>)</h1>
              <p class="text-muted">Posted on {{post.created_at}}</p>
              <img src="{{post.image_url}}" class="img-fluid mb-4" alt="Blog Image">
              <p>{{post.content}}</p>
            </div>
            <div class="col-lg-4">
              <div class="card mt-3">
                <div class="card-body">
                  <h5 class="card-title">Related Posts</h5>
                  <ul class="list-unstyled">
                  {% for related_post in related_posts %}
                  <li>
            <a href="{% url 'blog:detail' slug=related_post.slug %}">
            {{ related_post.title }}
    </a>
</li>
{% endfor %}
                  </ul>
                </div>
              </div>
            </div>
        </div>
    </div>
    <footer class="bg-dark text-light p-3 fixed-bottom">
        <div class="col-4 d-flex justify-content-center align-items-center">
          <span class="text-light">© 2021 Company, Inc</span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
{%endblock%}
